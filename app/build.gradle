plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'in.vemzora.rider'
    compileSdk 35

    defaultConfig {
        applicationId 'in.vemzora.rider'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'RIDER_URL', '\"https://vemzora.in/?riderApp=1\"'
    }

    // Keep Java and Kotlin bytecode targets aligned.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}
